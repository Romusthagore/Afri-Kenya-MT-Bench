# Model
model_name: Qwen/Qwen3.5-4B
torch_dtype: bfloat16
local_files_only: false

# LoRA
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  target_modules: all-linear
  bias: none

# Training
training:
  learning_rate: 0.0002
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 3
  max_length: 512
  warmup_steps: 0
  lr_scheduler_type: cosine
  bf16: true
  gradient_checkpointing: true
  seed: 42

# Evaluation
evaluation:
  strategy: steps
  eval_steps: 500
  logging_steps: 10

# Checkpoints
checkpoint:
  save_strategy: steps
  save_steps: 500
  save_total_limit: 2
  report_to: none
